<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Informações de países, como bandeira, população e etc... ">
  <title>Conhecendo Países</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <link rel="apple-touch-icon" href="/conhecendo-paises/assets/icon-192.png">g
</head>
<body>
  <header>
    <h1>Explorador de Países!</h1>
  </header>
  <main>
    <section class="search-section">
      <label for="paisEntrada" class="search-only">Digite o nome de um país.</label>
      <input type="text" id="paisEntrada" placeholder="Ex: Brasil">
      <button id="btnVoz" aria-label="Busca por voz" title="Pesquisar por voz">🎤</button>
      <button id="buscarBtn">Buscar</button>
    </section>
    <section id="result" class="result-section" aria-live="polite">
    </section>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrado.', reg))
            .catch(err => console.error('Erro no registro do Service Worker.', err));
        });
      }
    </script>  
  </main>
</body>
</html>
